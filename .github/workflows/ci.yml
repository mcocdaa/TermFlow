name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node-install-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv and tmux
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.19
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Sync locked workspace
        run: uv sync --frozen --all-packages

      - name: Build, install, and connect the frozen Node bundle
        run: scripts/release/verify_node_bundle.sh v0.1.0

  verify-clients:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      # contracts:check regenerates the client contracts from the protocol
      # package, so this job needs the locked Python workspace as well.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm

      - name: Install uv
        run: python -m pip install --disable-pip-version-check uv==0.11.19

      - name: Sync locked workspace
        run: uv sync --frozen --all-packages

      - name: Install locked client workspace
        run: npm ci

      - name: Verify generated client contracts
        run: npm run contracts:check

      - name: Test clients
        run: npm run test:run

      - name: Typecheck clients
        run: npm run typecheck

      - name: Build client workspaces
        run: npm run build --workspaces --if-present

  verify-python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TERMFLOW_ADMIN_TOKEN: ci-admin-token-that-is-long-enough
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci/config
      XDG_STATE_HOME: ${{ github.workspace }}/.ci/state
      XDG_RUNTIME_DIR: ${{ github.workspace }}/.ci/runtime
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Install uv and tmux
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.19
          sudo apt-get update
          sudo apt-get install --yes tmux
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR"

      - name: Sync locked workspace
        run: uv sync --frozen --all-packages

      - name: Test Python workspace
        run: uv run --all-packages python -m pytest -q --junitxml=.ci/pytest.xml

      - name: Static checks
        run: |
          uv run --all-packages ruff check .
          uv run --all-packages mypy packages/protocol/src apps/control-plane/src apps/node/src

      - name: Upload test metadata on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: pytest-metadata
          path: .ci/pytest.xml
          if-no-files-found: ignore
          retention-days: 3

  verify-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TERMFLOW_ADMIN_TOKEN: ci-admin-token-that-is-long-enough
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
          # rust-cache keys caches by job id; keep the pre-split `verify`
          # cache after the verification split.
          shared-key: verify

      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - run: npm ci

      - name: Verify Rust and unsigned Linux Tauri compile
        run: scripts/verify-tauri.sh

  verify-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Validate and build Control Plane and Node images
        run: |
          # compose.yaml interpolates the OpenCode basic-auth pair, the agent
          # MCP token, and the model credential with `:?`, so validation
          # fails without them even though `config --quiet` never starts a
          # container.
          TERMFLOW_ADMIN_TOKEN=ci-admin-token-that-is-long-enough \
            OPENCODE_SERVER_USERNAME=termflow \
            OPENCODE_SERVER_PASSWORD=ci-opencode-password \
            OPENCODE_AGENT_MCP_TOKEN=ci-opencode-agent-mcp-token \
            OPENCODE_MODEL_API_KEY=ci-opencode-model-key \
            docker compose -f deploy/compose.yaml config --quiet
          TERMFLOW_ADMIN_TOKEN=ci-admin-token-that-is-long-enough \
            OPENCODE_SERVER_USERNAME=termflow \
            OPENCODE_SERVER_PASSWORD=ci-opencode-password \
            OPENCODE_AGENT_MCP_TOKEN=ci-opencode-agent-mcp-token \
            DEEPSEEK_API_KEY=ci-deepseek-key \
            TERMFLOW_RELEASE_IMAGE_TAG=ci \
            TERMFLOW_AGENT_PROVIDER_DEEPSEEK_ENDPOINT_ORIGIN=https://api.deepseek.com \
            TERMFLOW_AGENT_PROVIDER_DEEPSEEK_MODEL_IDS=deepseek-v4-flash \
            TERMFLOW_AGENT_PROVIDER_DEEPSEEK_REGION=global \
            TERMFLOW_AGENT_PROVIDER_DEEPSEEK_RETENTION_TERMS="account policy" \
            TERMFLOW_AGENT_PROVIDER_DEEPSEEK_RETENTION_VERSION=policy-2026-09 \
            TERMFLOW_AGENT_PROVIDER_DEEPSEEK_NO_TRAINING=true \
            TERMFLOW_AGENT_PROVIDER_DEEPSEEK_POLICY_VERSION=policy-2026-09 \
            docker compose -f deploy/compose.release.yaml config --quiet
          scripts/build-control-plane-image.sh termflow-control-plane:ci
          scripts/verify-control-plane-image.sh termflow-control-plane:ci
          scripts/release/verify_control_plane_release_image.sh termflow-control-plane:ci
          scripts/build-node-image.sh termflow-node:ci
          scripts/verify-node-image.sh termflow-node:ci

  tauri-desktop-unsigned:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Compile desktop without installer or signing
        run: npm run tauri:build --workspace @termflow/tauri-client -- --no-bundle

  tauri-android-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up the Android SDK
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" platform-tools > /dev/null
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the Android project from the committed Tauri configuration
        run: npm run tauri --workspace @termflow/tauri-client -- android init --ci
      - name: Configure Android orientation-aware system bars
        run: python scripts/release/configure_android_system_bars.py --activity apps/clients/tauri/src-tauri/gen/android/app/src/main/java/io/termflow/client/MainActivity.kt
      - name: Compile Android debug APK without publication signing
        run: npm run tauri --workspace @termflow/tauri-client -- android build --debug --ci --target aarch64 --apk

  tauri-ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the iOS project from the committed Tauri configuration
        run: npm run tauri --workspace @termflow/tauri-client -- ios init --ci
      - name: Compile iOS simulator debug app without publication signing
        run: npm run tauri --workspace @termflow/tauri-client -- ios build --debug --ci --target aarch64-sim
