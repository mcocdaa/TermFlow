name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node-install-acceptance:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv and tmux
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.19
          sudo apt-get update
          sudo apt-get install --yes tmux

      - name: Sync locked workspace
        run: uv sync --frozen --all-packages

      - name: Build, install, and connect the frozen Node bundle
        run: scripts/release/verify_node_bundle.sh v0.1.0

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TERMFLOW_ADMIN_TOKEN: ci-admin-token-that-is-long-enough
      XDG_CONFIG_HOME: ${{ github.workspace }}/.ci/config
      XDG_STATE_HOME: ${{ github.workspace }}/.ci/state
      XDG_RUNTIME_DIR: ${{ github.workspace }}/.ci/runtime

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target

      - name: Install uv and tmux
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.19
          sudo apt-get update
          sudo apt-get install --yes tmux libwebkit2gtk-4.1-dev libxdo-dev \
            libssl-dev libayatana-appindicator3-dev librsvg2-dev
          mkdir -p "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$XDG_RUNTIME_DIR"

      - name: Sync locked workspace
        run: uv sync --frozen --all-packages

      - name: Install locked client workspace
        run: npm ci

      - name: Verify generated client contracts
        run: npm run contracts:check

      - name: Test clients
        run: npm run test:run

      - name: Typecheck clients
        run: npm run typecheck

      - name: Build client workspaces
        run: npm run build --workspaces --if-present

      - name: Test Python workspace
        run: uv run --all-packages pytest -q --junitxml=.ci/pytest.xml

      - name: Static checks
        run: |
          uv run --all-packages ruff check .
          uv run --all-packages mypy packages/protocol/src apps/control-plane/src apps/node/src

      - name: Verify Rust and unsigned Linux Tauri compile
        run: scripts/verify-tauri.sh

      - name: Validate and build Control Plane image
        run: |
          TERMFLOW_IMAGE=termflow-control-plane:ci docker compose -f deploy/compose.yaml config --quiet
          scripts/build-control-plane-image.sh termflow-control-plane:ci
          scripts/verify-control-plane-image.sh termflow-control-plane:ci
          scripts/release/verify_control_plane_release_image.sh termflow-control-plane:ci

      - name: Upload test metadata on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-metadata
          path: .ci/pytest.xml
          if-no-files-found: ignore
          retention-days: 3

  tauri-desktop-unsigned:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - name: Install Linux Tauri prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Compile desktop without installer or signing
        run: npm run tauri:build --workspace @termflow/tauri-client -- --no-bundle

  tauri-android-unsigned:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the Android project from the committed Tauri configuration
        run: npm run tauri --workspace @termflow/tauri-client -- android init --ci
      - name: Compile Android debug APK without publication signing
        run: npm run tauri --workspace @termflow/tauri-client -- android build --debug --ci --target aarch64 --apk

  tauri-ios-unsigned:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the iOS project from the committed Tauri configuration
        run: npm run tauri --workspace @termflow/tauri-client -- ios init --ci
      - name: Compile iOS simulator debug app without publication signing
        run: npm run tauri --workspace @termflow/tauri-client -- ios build --debug --ci --target aarch64-sim
