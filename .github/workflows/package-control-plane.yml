name: Package B + Web C · Control Plane
run-name: Package B + Web C · ${{ inputs.release_tag || inputs.version || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Build version override; defaults to 0.0.1-dev.0
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Validated v-prefixed release tag; empty for manual packaging
        required: false
        default: ""
        type: string
      version:
        description: Non-release build version override
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: package-control-plane-${{ github.ref }}-${{ inputs.release_tag || 'manual' }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.context.outputs.version }}
      release_tag: ${{ steps.context.outputs.tag }}
      is_release: ${{ steps.context.outputs.is_release }}
      is_prerelease: ${{ steps.context.outputs.is_prerelease }}
      artifact_name: ${{ steps.context.outputs.artifact_name }}
      retention_days: ${{ steps.context.outputs.retention_days }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Resolve validated package context
        id: context
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TERMFLOW_BUILD_VERSION: ${{ inputs.version || vars.TERMFLOW_BUILD_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          python scripts/release/prepare_version.py \
            --tag "$release_tag" --resolve-only
          if [[ -n "$release_tag" ]]; then
            artifact_name="termflow-${release_tag}-control-plane"
            retention_days=1
          else
            artifact_name="termflow-control-plane"
            retention_days=14
          fi
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          echo "retention_days=$retention_days" >> "$GITHUB_OUTPUT"

  package:
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release/prepare_version.py
      - name: Build, verify, archive, and reload the image
        env:
          LOCAL_IMAGE: termflow-control-plane:package-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p release-assets
          scripts/build-control-plane-image.sh "$LOCAL_IMAGE"
          scripts/verify-control-plane-image.sh "$LOCAL_IMAGE"
          scripts/release/verify_control_plane_release_image.sh "$LOCAL_IMAGE"
          scripts/release/archive_control_plane_image.sh \
            "$LOCAL_IMAGE" release-assets/termflow-control-plane.tar
          scripts/verify-control-plane-image.sh "$LOCAL_IMAGE"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: release-assets/termflow-control-plane.tar
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.prepare.outputs.retention_days) }}
          compression-level: 0

  publish:
    needs: [prepare, package]
    if: ${{ needs.prepare.outputs.is_release == 'true' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.prepare.outputs.version }}
        run: python scripts/release/prepare_version.py
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the validated multi-architecture image
        id: push
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          IS_PRERELEASE: ${{ needs.prepare.outputs.is_prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/termflow-control-plane"
          image_tag="${RELEASE_TAG//+/_}"
          tags=(
            --tag "${image}:${image_tag}"
            --tag "${image}:sha-${GITHUB_SHA}"
          )
          if [[ "$IS_PRERELEASE" == "false" ]]; then
            tags+=(--tag "${image}:latest")
          fi
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --provenance mode=max \
            --attest type=sbom \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            "${tags[@]}" \
            -f deploy/Dockerfile.control-plane .
          digest="$(docker buildx imagetools inspect \
            "ghcr.io/${owner}/termflow-control-plane:${image_tag}" \
            --format '{{.Manifest.Digest}}')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3
      - name: Sign the published image keylessly
        if: ${{ steps.push.outputs.digest != '' }}
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          cosign sign --yes "ghcr.io/${owner}/termflow-control-plane@${DIGEST}"
