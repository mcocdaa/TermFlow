name: Publish TermFlow Release
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: termflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the tag and all product versions
        id: version
        shell: bash
        run: python scripts/release/check_version.py --tag "$GITHUB_REF_NAME"

  node-bundle:
    name: Linux x86_64 Node bundle
    needs: validate-version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and tmux
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.19
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Sync locked workspace
        run: uv sync --frozen --all-packages
      - name: Build the frozen Node bundle and installer
        run: |
          mkdir -p release-assets
          scripts/release/build_node_bundle.sh "$GITHUB_REF_NAME" release-assets
          uv run --frozen python scripts/release/render_node_installer.py \
            "$GITHUB_REF_NAME" release-assets/install-termflow-node.sh
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-node-linux-x86_64
          path: |
            release-assets/termflow-node-linux-x86_64.tar.gz
            release-assets/install-termflow-node.sh
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  node-bundle-verify:
    name: Installed Linux Node reaches Control Plane
    needs: validate-version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv and tmux
        run: |
          python -m pip install --disable-pip-version-check uv==0.11.19
          sudo apt-get update
          sudo apt-get install --yes tmux
      - name: Sync locked workspace
        run: uv sync --frozen --all-packages
      - name: Verify an installed frozen Node reaches the Control Plane
        run: scripts/release/verify_node_bundle.sh "$GITHUB_REF_NAME"

  control-plane-verify:
    name: Control Plane release-image smoke
    needs: validate-version
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify the source-free Control Plane image
        run: |
          scripts/build-control-plane-image.sh termflow-control-plane:release-test
          scripts/verify-control-plane-image.sh termflow-control-plane:release-test
          scripts/release/verify_control_plane_release_image.sh termflow-control-plane:release-test

  windows-nsis:
    name: Windows x64 · NSIS
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Build unsigned NSIS installer
        run: npm run tauri:build --workspace @termflow/tauri-client -- --bundles nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-windows-x64-nsis
          path: apps/clients/tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  linux-packages:
    name: Linux x64 · deb and AppImage
    needs: validate-version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libfuse2 \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build deb and AppImage packages
        run: npm run tauri:build --workspace @termflow/tauri-client -- --bundles deb,appimage --ci
      - name: Require one package of each Linux format
        shell: bash
        run: |
          set -euo pipefail
          deb_count="$(find apps/clients/tauri/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)"
          appimage_count="$(find apps/clients/tauri/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          if [ "$deb_count" -ne 1 ] || [ "$appimage_count" -ne 1 ]; then
            echo "Expected one deb and one AppImage; found deb=$deb_count AppImage=$appimage_count" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-linux-x64
          path: |
            apps/clients/tauri/src-tauri/target/release/bundle/deb/*.deb
            apps/clients/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  macos-packages:
    name: macOS arm64 · app and DMG
    needs: validate-version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Build ad-hoc-signed app and DMG packages
        run: >-
          npm run tauri:build --workspace @termflow/tauri-client --
          --bundles app,dmg --ci
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Preserve the macOS app bundle as a zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-artifacts"
          set -- apps/clients/tauri/src-tauri/target/release/bundle/macos/*.app
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "Expected exactly one macOS app bundle" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$1" "$RUNNER_TEMP/termflow-artifacts/TermFlow-macos-arm64.app.zip"
          set -- apps/clients/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one macOS DMG" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-macos-arm64
          path: |
            ${{ runner.temp }}/termflow-artifacts/TermFlow-macos-arm64.app.zip
            apps/clients/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  android-debug-apk:
    name: Android arm64 · debug APK
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the Android project
        run: npm run tauri --workspace @termflow/tauri-client -- android init --ci
      - name: Build an installable debug-keystore-signed APK
        run: npm run tauri --workspace @termflow/tauri-client -- android build --debug --ci --target aarch64 --apk
      - name: Require exactly one debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk_count="$(find apps/clients/tauri/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-debug.apk' | wc -l)"
          if [ "$apk_count" -ne 1 ]; then
            echo "Expected exactly one debug APK, found $apk_count" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-android-arm64-debug
          path: apps/clients/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*-debug.apk
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  ios-simulator-app:
    name: iOS arm64 simulator · app
    needs: validate-version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the iOS project
        run: npm run tauri --workspace @termflow/tauri-client -- ios init --ci
      - name: Build the aarch64 simulator debug app without publication signing
        run: npm run tauri --workspace @termflow/tauri-client -- ios build --debug --ci --target aarch64-sim --no-sign
      - name: Preserve the simulator app bundle as a zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-artifacts"
          set -- apps/clients/tauri/src-tauri/gen/apple/build/aarch64-sim/*.app
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "Expected exactly one iOS simulator app bundle" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$1" "$RUNNER_TEMP/termflow-artifacts/TermFlow-ios-simulator-aarch64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-ios-simulator-aarch64
          path: ${{ runner.temp }}/termflow-artifacts/TermFlow-ios-simulator-aarch64.app.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish:
    name: Publish immutable image and GitHub Release
    needs:
      - validate-version
      - node-bundle
      - node-bundle-verify
      - control-plane-verify
      - windows-nsis
      - linux-packages
      - macos-packages
      - android-debug-apk
      - ios-simulator-app
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-node-linux-x86_64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-windows-x64-nsis
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-linux-x64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-macos-arm64
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-android-arm64-debug
          path: release-assets
      - uses: actions/download-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-ios-simulator-aarch64
          path: release-assets
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push immutable multi-architecture Control Plane image
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER}/termflow-control-plane"
          docker buildx build --platform linux/amd64,linux/arm64 --push \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${{ needs.validate-version.outputs.version }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --tag "${image}:${GITHUB_REF_NAME}" \
            --tag "${image}:sha-${GITHUB_SHA}" \
            -f deploy/Dockerfile.control-plane .
          if [[ "${GITHUB_REF_NAME}" != *-* ]]; then
            docker buildx imagetools create --tag "${image}:latest" "${image}:${GITHUB_REF_NAME}"
          fi
      - name: Generate checksums and create the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha256sum release-assets/* > release-assets/SHA256SUMS
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "TermFlow ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Windows package is unsigned. iOS Simulator-only package is not for physical devices." \
            "${prerelease[@]}"
