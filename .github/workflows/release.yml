name: Publish TermFlow Release
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: termflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate the tag and all product versions
        id: version
        shell: bash
        run: python scripts/release/check_version.py --tag "$GITHUB_REF_NAME"

  package-node:
    name: Package A
    needs: validate-version
    uses: ./.github/workflows/package-node.yml
    with:
      release_tag: ${{ github.ref_name }}

  package-clients:
    name: Package native C
    needs: validate-version
    uses: ./.github/workflows/tauri-packages.yml
    with:
      platform: all
      release_tag: ${{ github.ref_name }}

  package-control-plane:
    name: Package B + Web C
    needs: [package-node, package-clients]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/package-control-plane.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    name: Publish GitHub Release
    needs:
      - validate-version
      - package-node
      - package-clients
      - package-control-plane
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Regenerate checksums and create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd release-assets && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS)
          prerelease=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "TermFlow ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Windows package is unsigned. Android uses a debug key. iOS is Simulator-only." \
            "${prerelease[@]}"
