name: Publish TermFlow Release
run-name: Publish ${{ github.ref_name }}

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: termflow-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Resolve release tag
        id: version
        shell: bash
        run: python scripts/release/prepare_version.py --tag "$GITHUB_REF_NAME" --resolve-only

  package-node:
    name: Package A
    needs: validate-version
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/package-node.yml
    with:
      release_tag: ${{ github.ref_name }}

  package-clients:
    name: Package native C
    needs: validate-version
    uses: ./.github/workflows/tauri-packages.yml
    secrets: inherit
    with:
      platform: all
      release_tag: ${{ github.ref_name }}

  package-control-plane:
    name: Package B + Web C
    needs: [package-node, package-clients]
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/package-control-plane.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    name: Publish GitHub Release
    needs:
      - validate-version
      - package-node
      - package-clients
      - package-control-plane
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0  # v5
        with:
          path: release-assets
          merge-multiple: true
      - name: Drop artifact directory remnants
        shell: bash
        run: |
          set -euo pipefail
          find release-assets -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
      - name: Regenerate checksums and create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ needs.validate-version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          (cd release-assets && rm -f SHA256SUMS && sha256sum -- * > SHA256SUMS)
          prerelease=()
          if [[ "$IS_PRERELEASE" == "true" ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "${GITHUB_REF_NAME}" release-assets/* \
            --title "TermFlow ${GITHUB_REF_NAME}" \
            --generate-notes \
            --notes "Windows package is unsigned. Android release APK uses the fixed TermFlow signing certificate; rc.3/rc.4 Android users must uninstall once before installing rc.5. iOS is Simulator-only." \
            "${prerelease[@]}"
      - uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45  # v2
        with:
          subject-path: "release-assets/*"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9  # v3
      - name: Verify the signed control-plane image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="${GITHUB_REF_NAME//+/_}"
          cosign verify \
            "ghcr.io/${owner}/termflow-control-plane:${image_tag}" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/package-control-plane.yml" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            >/dev/null
      - name: Verify the signed node image
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image_tag="${GITHUB_REF_NAME//+/_}"
          cosign verify \
            "ghcr.io/${owner}/termflow-node:${image_tag}" \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/package-node.yml" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            >/dev/null
