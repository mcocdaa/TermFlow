name: Package C · Native Clients
run-name: Package C · ${{ inputs.platform }} · ${{ inputs.release_tag || inputs.version || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform package to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
          - android
          - ios
      version:
        description: Build version override; defaults to 0.0.1-dev.0
        required: false
        default: ""
        type: string
      signed_android_candidate:
        description: Build Android with the fixed release signing certificate
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      platform:
        description: Native client platform set
        required: false
        default: all
        type: string
      release_tag:
        description: Validated v-prefixed release tag; empty for manual packaging
        required: false
        default: ""
        type: string
      version:
        description: Non-release build version override
        required: false
        default: ""
        type: string
      signed_android_candidate:
        description: Build Android with the fixed release signing certificate
        required: false
        default: false
        type: boolean
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      ANDROID_SIGNING_CERT_SHA256:
        required: false

permissions:
  contents: read

concurrency:
  group: tauri-packages-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate package version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      artifact_prefix: ${{ steps.version.outputs.artifact_prefix }}
      retention_days: ${{ steps.version.outputs.retention_days }}
      android_release_build: ${{ steps.version.outputs.android_release_build }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Validate configured version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TERMFLOW_BUILD_VERSION: ${{ inputs.version || vars.TERMFLOW_BUILD_VERSION }}
          SIGNED_ANDROID_CANDIDATE: ${{ inputs.signed_android_candidate }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          python scripts/release/prepare_version.py \
            --tag "$release_tag" --resolve-only
          if [[ -n "$release_tag" ]]; then
            artifact_prefix="termflow-${release_tag}"
            retention_days=1
          else
            artifact_prefix=termflow
            retention_days=14
          fi
          if [[ -n "$release_tag" || "$SIGNED_ANDROID_CANDIDATE" == "true" ]]; then
            android_release_build=true
          else
            android_release_build=false
          fi
          echo "artifact_prefix=$artifact_prefix" >> "$GITHUB_OUTPUT"
          echo "retention_days=$retention_days" >> "$GITHUB_OUTPUT"
          echo "android_release_build=$android_release_build" >> "$GITHUB_OUTPUT"

  windows-nsis:
    name: Windows x64 · NSIS
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Build unsigned NSIS installer
        run: npm run tauri:build --workspace @termflow/tauri-client -- --bundles nsis --ci
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-windows-x64-nsis
          path: apps/clients/tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0

  linux-packages:
    name: Linux x64 · deb and AppImage
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libfuse2 \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build DEB package
        run: npm run tauri:build --workspace @termflow/tauri-client -- --bundles deb --ci
      - name: Build AppImage package with bounded retries
        run: scripts/release/build_linux_appimage.sh
      - name: Require one package of each Linux format
        shell: bash
        run: |
          set -euo pipefail
          deb_count="$(find apps/clients/tauri/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)"
          appimage_count="$(find apps/clients/tauri/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          if [ "$deb_count" -ne 1 ] || [ "$appimage_count" -ne 1 ]; then
            echo "Expected one deb and one AppImage; found deb=$deb_count AppImage=$appimage_count" >&2
            exit 1
          fi
      - name: Stage the Linux packages flat
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-linux"
          cp apps/clients/tauri/src-tauri/target/release/bundle/deb/*.deb \
            apps/clients/tauri/src-tauri/target/release/bundle/appimage/*.AppImage \
            "$RUNNER_TEMP/termflow-linux/"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-linux-x64
          path: ${{ runner.temp }}/termflow-linux/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0

  macos-packages:
    name: macOS arm64 · app and DMG
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'macos') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Build ad-hoc-signed app and DMG packages
        run: >-
          npm run tauri:build --workspace @termflow/tauri-client --
          --bundles app,dmg --ci
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Preserve the macOS app bundle as a zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-artifacts"
          set -- apps/clients/tauri/src-tauri/target/release/bundle/macos/*.app
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "Expected exactly one macOS app bundle" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$1" "$RUNNER_TEMP/termflow-artifacts/TermFlow-macos-arm64.app.zip"
          set -- apps/clients/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one macOS DMG" >&2
            exit 1
          fi
          cp "$1" "$RUNNER_TEMP/termflow-artifacts/"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-macos-arm64
          path: ${{ runner.temp }}/termflow-artifacts/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0

  android-apk:
    name: Android arm64 · APK
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961  # v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699  # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the Android project
        run: npm run tauri --workspace @termflow/tauri-client -- android init --ci
      - name: Configure Android orientation-aware system bars
        run: python scripts/release/configure_android_system_bars.py --activity apps/clients/tauri/src-tauri/gen/android/app/src/main/java/io/termflow/client/MainActivity.kt
      - name: Generate TermFlow mobile launcher resources
        run: npm run tauri --workspace @termflow/tauri-client -- icon app-icon-mobile.svg
      - name: Configure Android release signing
        if: ${{ needs.validate-version.outputs.android_release_build == 'true' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD ANDROID_SIGNING_CERT_SHA256; do
            if [[ -z "${!name}" ]]; then
              echo "Missing required Android release secret: $name" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/termflow-android-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          export ANDROID_KEYSTORE_PATH="$keystore"
          python scripts/release/configure_android_signing.py \
            --gradle apps/clients/tauri/src-tauri/gen/android/app/build.gradle.kts \
            --properties apps/clients/tauri/src-tauri/gen/android/keystore.properties
      - name: Build the signed release APK
        if: ${{ needs.validate-version.outputs.android_release_build == 'true' }}
        run: npm run tauri --workspace @termflow/tauri-client -- android build --ci --target aarch64 --apk
      - name: Build a manual debug APK
        if: ${{ needs.validate-version.outputs.android_release_build != 'true' }}
        run: npm run tauri --workspace @termflow/tauri-client -- android build --debug --ci --target aarch64 --apk
      - name: Resolve Android APK
        id: apk
        env:
          ANDROID_RELEASE_BUILD: ${{ needs.validate-version.outputs.android_release_build }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$ANDROID_RELEASE_BUILD" == "true" ]]; then
            pattern='*-release.apk'
          else
            pattern='*-debug.apk'
          fi
          mapfile -d '' apk_files < <(find \
            apps/clients/tauri/src-tauri/gen/android/app/build/outputs/apk \
            -type f -name "$pattern" -print0)
          if [[ "${#apk_files[@]}" -ne 1 ]]; then
            echo "Expected exactly one Android APK matching $pattern; found ${#apk_files[@]}" >&2
            exit 1
          fi
          echo "apk_path=${apk_files[0]}" >> "$GITHUB_OUTPUT"
      - name: Verify Android APK identity
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
          ANDROID_RELEASE_BUILD: ${{ needs.validate-version.outputs.android_release_build }}
          ANDROID_SIGNING_CERT_SHA256: ${{ secrets.ANDROID_SIGNING_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          ANDROID_VERSION_CODE="$(python -c \
            'import sys; from scripts.release.build_version import android_version_code; print(android_version_code(sys.argv[1]))' \
            "$TERMFLOW_BUILD_VERSION")"
          verify_args=(
            --apk "$APK_PATH"
            --generated-res apps/clients/tauri/src-tauri/gen/android/app/src/main/res
            --expected-package io.termflow.client
            --expected-version-name "$TERMFLOW_BUILD_VERSION"
            --expected-version-code "$ANDROID_VERSION_CODE"
          )
          if [[ "$ANDROID_RELEASE_BUILD" == "true" ]]; then
            verify_args+=(--expected-cert-sha256 "$ANDROID_SIGNING_CERT_SHA256")
          fi
          python scripts/release/verify_android_apk.py "${verify_args[@]}"
      - name: Stage the Android APK flat
        env:
          APK_PATH: ${{ steps.apk.outputs.apk_path }}
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-android"
          cp "$APK_PATH" \
            "$RUNNER_TEMP/termflow-android/TermFlow-${TERMFLOW_BUILD_VERSION}-android-arm64.apk"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-android-arm64-apk
          path: ${{ runner.temp }}/termflow-android/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0
      - name: Remove Android signing material
        if: ${{ always() }}
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/termflow-android-release.jks"
          rm -f apps/clients/tauri/src-tauri/gen/android/keystore.properties

  ios-simulator-app:
    name: iOS arm64 simulator · app
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'ios') }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444  # v5
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c  # stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c  # v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the iOS project
        run: npm run tauri --workspace @termflow/tauri-client -- ios init --ci
      - name: Build the aarch64 simulator debug app without publication signing
        run: npm run tauri --workspace @termflow/tauri-client -- ios build --debug --ci --target aarch64-sim --no-sign
      - name: Preserve the simulator app bundle as a zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-artifacts"
          set -- apps/clients/tauri/src-tauri/gen/apple/build/arm64-sim/*.app
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "Expected exactly one iOS simulator app bundle" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$1" "$RUNNER_TEMP/termflow-artifacts/TermFlow-ios-simulator-aarch64.app.zip"
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-ios-simulator-aarch64
          path: ${{ runner.temp }}/termflow-artifacts/TermFlow-ios-simulator-aarch64.app.zip
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0
