name: Tauri Multi-platform Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-version:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Validate configured version and release tag
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("node:fs");

          const packageVersion = (path) => JSON.parse(fs.readFileSync(path, "utf8")).version;
          const cargoText = fs.readFileSync(
            "apps/clients/tauri/src-tauri/Cargo.toml",
            "utf8",
          );
          const cargoVersion = cargoText.match(/^version\s*=\s*"([^"]+)"$/m)?.[1];
          const versions = {
            "package.json": packageVersion("package.json"),
            "apps/clients/tauri/package.json": packageVersion(
              "apps/clients/tauri/package.json",
            ),
            "apps/clients/tauri/src-tauri/Cargo.toml": cargoVersion,
            "apps/clients/tauri/src-tauri/tauri.conf.json": packageVersion(
              "apps/clients/tauri/src-tauri/tauri.conf.json",
            ),
          };
          if (Object.values(versions).some((version) => !version)) {
            throw new Error("Every configured package must declare a version");
          }
          const configuredVersions = new Set(Object.values(versions));
          if (configuredVersions.size !== 1) {
            throw new Error("Configured versions disagree: " + JSON.stringify(versions));
          }

          const configuredVersion = Object.values(versions)[0];
          if (process.env.EVENT_NAME === "push") {
            const tagName = process.env.TAG_NAME || "";
            const semverTag = /^v\d+\.\d+\.\d+(?:-[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?(?:\+[0-9A-Za-z]+(?:[.-][0-9A-Za-z]+)*)?$/;
            if (!semverTag.test(tagName)) {
              throw new Error("Release tag must be a v-prefixed SemVer: " + tagName);
            }
            const tagVersion = tagName.slice(1);
            if (tagVersion !== configuredVersion) {
              throw new Error(
                "Release tag " + tagName + " disagrees with configured version " + configuredVersion,
              );
            }
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, "version=" + configuredVersion + "\n");
          console.log("Packaging TermFlow " + configuredVersion);
          NODE

  windows-nsis:
    needs: validate-version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Build unsigned NSIS installer
        run: npm run tauri:build --workspace @termflow/tauri-client -- --bundles nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-windows-x64-nsis
          path: apps/clients/tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
          compression-level: 0

  linux-packages:
    needs: validate-version
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libfuse2 \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build deb and AppImage packages
        run: npm run tauri:build --workspace @termflow/tauri-client -- --bundles deb,appimage --ci
      - name: Require one package of each Linux format
        shell: bash
        run: |
          set -euo pipefail
          deb_count="$(find apps/clients/tauri/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)"
          appimage_count="$(find apps/clients/tauri/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          if [ "$deb_count" -ne 1 ] || [ "$appimage_count" -ne 1 ]; then
            echo "Expected one deb and one AppImage; found deb=$deb_count AppImage=$appimage_count" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-linux-x64
          path: |
            apps/clients/tauri/src-tauri/target/release/bundle/deb/*.deb
            apps/clients/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
          compression-level: 0

  macos-packages:
    needs: validate-version
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Build ad-hoc-signed app and DMG packages
        run: >-
          npm run tauri:build --workspace @termflow/tauri-client --
          --bundles app,dmg --ci
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Preserve the macOS app bundle as a zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-artifacts"
          set -- apps/clients/tauri/src-tauri/target/release/bundle/macos/*.app
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "Expected exactly one macOS app bundle" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$1" "$RUNNER_TEMP/termflow-artifacts/TermFlow-macos-arm64.app.zip"
          set -- apps/clients/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one macOS DMG" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-macos-arm64
          path: |
            ${{ runner.temp }}/termflow-artifacts/TermFlow-macos-arm64.app.zip
            apps/clients/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
          compression-level: 0

  android-debug-apk:
    needs: validate-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the Android project
        run: npm run tauri --workspace @termflow/tauri-client -- android init --ci
      - name: Build an installable debug-keystore-signed APK
        run: npm run tauri --workspace @termflow/tauri-client -- android build --debug --ci --target aarch64 --apk
      - name: Require exactly one debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk_count="$(find apps/clients/tauri/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-debug.apk' | wc -l)"
          if [ "$apk_count" -ne 1 ]; then
            echo "Expected exactly one debug APK, found $apk_count" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-android-arm64-debug
          path: apps/clients/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*-debug.apk
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
          compression-level: 0

  ios-simulator-app:
    needs: validate-version
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the iOS project
        run: npm run tauri --workspace @termflow/tauri-client -- ios init --ci
      - name: Build the aarch64 simulator debug app without publication signing
        run: npm run tauri --workspace @termflow/tauri-client -- ios build --debug --ci --target aarch64-sim --no-sign
      - name: Preserve the simulator app bundle as a zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-artifacts"
          set -- apps/clients/tauri/src-tauri/gen/apple/build/aarch64-sim/*.app
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "Expected exactly one iOS simulator app bundle" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$1" "$RUNNER_TEMP/termflow-artifacts/TermFlow-ios-simulator-aarch64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: termflow-${{ needs.validate-version.outputs.version }}-ios-simulator-aarch64
          path: ${{ runner.temp }}/termflow-artifacts/TermFlow-ios-simulator-aarch64.app.zip
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && 90 || 14 }}
          compression-level: 0
