name: Package C · Native Clients
run-name: Package C · ${{ inputs.platform }} · ${{ inputs.release_tag || inputs.version || 'manual' }}

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform package to build
        required: true
        default: all
        type: choice
        options:
          - all
          - windows
          - linux
          - macos
          - android
          - ios
      version:
        description: Build version override; defaults to 0.0.1-dev.0
        required: false
        default: ""
        type: string
  workflow_call:
    inputs:
      platform:
        description: Native client platform set
        required: false
        default: all
        type: string
      release_tag:
        description: Validated v-prefixed release tag; empty for manual packaging
        required: false
        default: ""
        type: string
      version:
        description: Non-release build version override
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: tauri-packages-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate package version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      is_release: ${{ steps.version.outputs.is_release }}
      is_prerelease: ${{ steps.version.outputs.is_prerelease }}
      artifact_prefix: ${{ steps.version.outputs.artifact_prefix }}
      retention_days: ${{ steps.version.outputs.retention_days }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - name: Validate configured version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          TERMFLOW_BUILD_VERSION: ${{ inputs.version || vars.TERMFLOW_BUILD_VERSION }}
        shell: bash
        run: |
          set -euo pipefail
          release_tag="$RELEASE_TAG"
          python scripts/release/prepare_version.py \
            --tag "$release_tag" --resolve-only >/dev/null
          if [[ -n "$release_tag" ]]; then
            artifact_prefix="termflow-${release_tag}"
            retention_days=1
          else
            artifact_prefix=termflow
            retention_days=14
          fi
          echo "artifact_prefix=$artifact_prefix" >> "$GITHUB_OUTPUT"
          echo "retention_days=$retention_days" >> "$GITHUB_OUTPUT"

  windows-nsis:
    name: Windows x64 · NSIS
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'windows') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Build unsigned NSIS installer
        run: npm run tauri:build --workspace @termflow/tauri-client -- --bundles nsis --ci
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-windows-x64-nsis
          path: apps/clients/tauri/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0

  linux-packages:
    name: Linux x64 · deb and AppImage
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'linux') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl wget file libfuse2 \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci
      - name: Build deb and AppImage packages
        run: npm run tauri:build --workspace @termflow/tauri-client -- --bundles deb,appimage --ci
      - name: Require one package of each Linux format
        shell: bash
        run: |
          set -euo pipefail
          deb_count="$(find apps/clients/tauri/src-tauri/target/release/bundle/deb -maxdepth 1 -type f -name '*.deb' | wc -l)"
          appimage_count="$(find apps/clients/tauri/src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' | wc -l)"
          if [ "$deb_count" -ne 1 ] || [ "$appimage_count" -ne 1 ]; then
            echo "Expected one deb and one AppImage; found deb=$deb_count AppImage=$appimage_count" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-linux-x64
          path: |
            apps/clients/tauri/src-tauri/target/release/bundle/deb/*.deb
            apps/clients/tauri/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0

  macos-packages:
    name: macOS arm64 · app and DMG
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'macos') }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Build ad-hoc-signed app and DMG packages
        run: >-
          npm run tauri:build --workspace @termflow/tauri-client --
          --bundles app,dmg --ci
          --config '{"bundle":{"macOS":{"signingIdentity":"-"}}}'
      - name: Preserve the macOS app bundle as a zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-artifacts"
          set -- apps/clients/tauri/src-tauri/target/release/bundle/macos/*.app
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "Expected exactly one macOS app bundle" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$1" "$RUNNER_TEMP/termflow-artifacts/TermFlow-macos-arm64.app.zip"
          set -- apps/clients/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if [ "$#" -ne 1 ] || [ ! -f "$1" ]; then
            echo "Expected exactly one macOS DMG" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-macos-arm64
          path: |
            ${{ runner.temp }}/termflow-artifacts/TermFlow-macos-arm64.app.zip
            apps/clients/tauri/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0

  android-debug-apk:
    name: Android arm64 · debug APK
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'android') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the Android project
        run: npm run tauri --workspace @termflow/tauri-client -- android init --ci
      - name: Build an installable debug-keystore-signed APK
        run: npm run tauri --workspace @termflow/tauri-client -- android build --debug --ci --target aarch64 --apk
      - name: Require exactly one debug APK
        shell: bash
        run: |
          set -euo pipefail
          apk_count="$(find apps/clients/tauri/src-tauri/gen/android/app/build/outputs/apk -type f -name '*-debug.apk' | wc -l)"
          if [ "$apk_count" -ne 1 ]; then
            echo "Expected exactly one debug APK, found $apk_count" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-android-arm64-debug
          path: apps/clients/tauri/src-tauri/gen/android/app/build/outputs/apk/**/*-debug.apk
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0

  ios-simulator-app:
    name: iOS arm64 simulator · app
    needs: validate-version
    if: >-
      ${{ needs.validate-version.result == 'success' &&
          (inputs.platform == 'all' || inputs.platform == 'ios') }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Materialize build version
        env:
          TERMFLOW_BUILD_VERSION: ${{ needs.validate-version.outputs.version }}
        run: python scripts/release/prepare_version.py >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/clients/tauri/src-tauri -> target
      - run: npm ci
      - name: Generate the iOS project
        run: npm run tauri --workspace @termflow/tauri-client -- ios init --ci
      - name: Build the aarch64 simulator debug app without publication signing
        run: npm run tauri --workspace @termflow/tauri-client -- ios build --debug --ci --target aarch64-sim --no-sign
      - name: Preserve the simulator app bundle as a zip
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/termflow-artifacts"
          set -- apps/clients/tauri/src-tauri/gen/apple/build/aarch64-sim/*.app
          if [ "$#" -ne 1 ] || [ ! -d "$1" ]; then
            echo "Expected exactly one iOS simulator app bundle" >&2
            exit 1
          fi
          ditto -c -k --sequesterRsrc --keepParent \
            "$1" "$RUNNER_TEMP/termflow-artifacts/TermFlow-ios-simulator-aarch64.app.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.validate-version.outputs.artifact_prefix }}-ios-simulator-aarch64
          path: ${{ runner.temp }}/termflow-artifacts/TermFlow-ios-simulator-aarch64.app.zip
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.validate-version.outputs.retention_days) }}
          compression-level: 0
