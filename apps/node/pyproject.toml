[project]
name = "termflow-node"
version = "0.2.0"
description = "Local tmux runtime and Bridge for TermFlow"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28,<1",
  "platformdirs>=4.11.12,<5",
  "pydantic-settings>=2.7,<3",
  "termflow-protocol",
  "typer>=0.15,<1",
  "websockets>=17.1,<18",
]

[project.scripts]
termflow = "termflow_node.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termflow_node"]

[tool.uv.sources]
termflow-protocol = { workspace = true }

[dependency-groups]
dev = [
  "mypy>=2.3.1,<3",
  "pyinstaller>=6.12,<7",
  "pexpect>=4.9,<5",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.16.8,<1",
]
