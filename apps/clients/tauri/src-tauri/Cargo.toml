[package]
name = "termflow-client"
version = "0.1.0"
description = "TermFlow desktop and mobile client"
edition = "2021"

[lib]
name = "termflow_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64 = "0.22.1"
p256 = { version = "0.13.2", features = ["ecdsa", "pkcs8"] }
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
sha2 = "0.10.9"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-http = "2.5.9"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-store = "2.4.4"
tauri-plugin-websocket = "2.4.2"
time = { version = "0.3.41", features = ["formatting"] }
tokio = { version = "1.53.1", features = ["sync"] }
url = "2.5.4"
uuid = { version = "1.17.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.20.0"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
keyring = { version = "=4.1.5", features = [] }

[target.'cfg(target_os = "ios")'.dependencies]
keyring-core = { version = "=1.0.0" }
apple-native-keyring-store = { version = "=1.0.1", features = ["protected"] }

[target.'cfg(target_os = "android")'.dependencies]
keyring-core = { version = "=1.0.0" }
android-native-keyring-store = { version = "=1.0.0" }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "=2.4.3", features = ["deep-link"] }
