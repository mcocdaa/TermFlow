[project]
name = "termflow-control-plane"
version = "0.0.1-dev.0"
description = "TermFlow central authentication and relay service"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "cryptography>=50,<60",
  "fastapi>=0.115,<1",
  "pyjwt[crypto]>=2.10,<3",
  "pyotp>=2.9,<3",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "termflow-protocol",
  "typer>=0.15,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.scripts]
termflow-control = "termflow_control_plane.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termflow_control_plane"]

[tool.uv.sources]
termflow-protocol = { workspace = true }

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]
