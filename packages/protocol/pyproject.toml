[project]
name = "termflow-protocol"
version = "0.0.1-dev.0"
description = "Versioned wire contracts for TermFlow"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/termflow_protocol"]

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1",
]

