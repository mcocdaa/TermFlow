# 发布镜像 Compose：生产部署路径。
#
# 只拉取 GHCR 上已发布的 Control Plane 镜像，不在本地构建，也不需要 checkout 源码。
# 服务形状与 deploy/compose.yaml + deploy/compose.agent-live.yaml 的组合完全一致
# （B + Web C、固定 OpenCode 运行时、allowlist provider egress proxy），差异只有：
# control-plane 引用发布镜像而不是本地 build，且项目名、卷名与端口默认值面向生产。
#
# 完整步骤见 docs/operations.md「发布镜像 Compose 部署」：
#
#   cp .env.example .env   # 固定版本：TERMFLOW_RELEASE_IMAGE_TAG=vX.Y.Z；跟随最新稳定版：latest
#   docker compose --env-file .env -f compose.release.yaml up -d
#
# 该文件与 deploy/opencode-config.yaml、deploy/provider-egress/squid.conf 一起使用；
# 这三个文件在同一个 tag 的源码树或 Release 目录里保持一致，不要混用版本。
name: termflow

services:
  control-plane:
    image: ${TERMFLOW_RELEASE_IMAGE_REPOSITORY:-ghcr.io/mcocdaa/termflow-control-plane}:${TERMFLOW_RELEASE_IMAGE_TAG:?set TERMFLOW_RELEASE_IMAGE_TAG in .env}
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
      - SETPCAP
    security_opt:
      - no-new-privileges:true
    command:
      - /opt/termflow/bin/termflow-control
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      TERMFLOW_ADMIN_TOKEN: ${TERMFLOW_ADMIN_TOKEN:?set TERMFLOW_ADMIN_TOKEN}
      TERMFLOW_DATABASE_URL: sqlite+aiosqlite:////app/data/termflow.db
      TERMFLOW_ALLOW_INSECURE_LOOPBACK: ${TERMFLOW_ALLOW_INSECURE_LOOPBACK:-true}
      TERMFLOW_STATIC_DIR: /app/frontend-dist
      TERMFLOW_PUBLIC_BASE_URL: ${TERMFLOW_PUBLIC_BASE_URL:-http://127.0.0.1:8765}
      TERMFLOW_BROWSER_SESSION_TTL_SECONDS: ${TERMFLOW_BROWSER_SESSION_TTL_SECONDS:-28800}
      TERMFLOW_BROWSER_SESSION_CAPACITY: ${TERMFLOW_BROWSER_SESSION_CAPACITY:-4096}
      TERMFLOW_TOTP_MASTER_KEY:
      TERMFLOW_TOTP_AUTO_MASTER_KEY_FILE: /app/totp-secrets/totp-master-key
      TERMFLOW_ENROLLMENT_TOKEN_TTL_SECONDS: ${TERMFLOW_ENROLLMENT_TOKEN_TTL_SECONDS:-60}
      TERMFLOW_TERMINAL_MAX_FRAME_BYTES: ${TERMFLOW_TERMINAL_MAX_FRAME_BYTES:-65536}
      TERMFLOW_TERMINAL_INPUT_RATE_BYTES_PER_SECOND: ${TERMFLOW_TERMINAL_INPUT_RATE_BYTES_PER_SECOND:-262144}
      TERMFLOW_TERMINAL_QUEUE_MAX_MESSAGES: ${TERMFLOW_TERMINAL_QUEUE_MAX_MESSAGES:-256}
      TERMFLOW_TERMINAL_QUEUE_MAX_BYTES: ${TERMFLOW_TERMINAL_QUEUE_MAX_BYTES:-1048576}
      TERMFLOW_TERMINAL_RESUME_GRACE_SECONDS: ${TERMFLOW_TERMINAL_RESUME_GRACE_SECONDS:-30}
      # B-to-OpenCode basic auth pair (mirrors the opencode-agent service's
      # OPENCODE_SERVER_* values; both or neither).
      TERMFLOW_AGENT_OPENCODE_USERNAME: ${OPENCODE_SERVER_USERNAME:-}
      TERMFLOW_AGENT_OPENCODE_PASSWORD: ${OPENCODE_SERVER_PASSWORD:-}
      # The hardened reference container has no /workspace mount. Its /tmp
      # tmpfs is the isolated, writable session directory for this deployment.
      TERMFLOW_AGENT_OPENCODE_DIRECTORY: ${TERMFLOW_AGENT_OPENCODE_DIRECTORY:-/tmp}
      # B's simplified supervisor and OpenCode must observe the same
      # binding-scoped MCP capability during an epoch restart.
      TERMFLOW_AGENT_OPENCODE_MCP_TOKEN: ${OPENCODE_AGENT_MCP_TOKEN:?set OPENCODE_AGENT_MCP_TOKEN}
      # Independent credential used only by the cleanup helper callback.  Keep
      # it separate from the administrator and MCP capabilities.
      TERMFLOW_AGENT_CLEANUP_HELPER_TOKEN: ${TERMFLOW_AGENT_CLEANUP_HELPER_TOKEN:-}
      # MCP endpoint DNS-rebinding allowlist: in-container OpenCode reaches B
      # over agent_internal by the service name, so the loopback-only defaults
      # would reject every request with 421.
      TERMFLOW_AGENT_MCP_ALLOWED_HOSTS: ${TERMFLOW_AGENT_MCP_ALLOWED_HOSTS:-control-plane:8000}
      # A live deployment is not considered provider-configured until the
      # operator supplies the complete, verified disclosure policy.  The
      # credential source is a fixed *name*, never a credential value.
      TERMFLOW_AGENT_PROVIDER_DEEPSEEK_ENDPOINT_ORIGIN: ${TERMFLOW_AGENT_PROVIDER_DEEPSEEK_ENDPOINT_ORIGIN:?set TERMFLOW_AGENT_PROVIDER_DEEPSEEK_ENDPOINT_ORIGIN}
      TERMFLOW_AGENT_PROVIDER_DEEPSEEK_MODEL_IDS: ${TERMFLOW_AGENT_PROVIDER_DEEPSEEK_MODEL_IDS:?set TERMFLOW_AGENT_PROVIDER_DEEPSEEK_MODEL_IDS}
      TERMFLOW_AGENT_PROVIDER_DEEPSEEK_REGION: ${TERMFLOW_AGENT_PROVIDER_DEEPSEEK_REGION:?set TERMFLOW_AGENT_PROVIDER_DEEPSEEK_REGION}
      TERMFLOW_AGENT_PROVIDER_DEEPSEEK_RETENTION_TERMS: ${TERMFLOW_AGENT_PROVIDER_DEEPSEEK_RETENTION_TERMS:?set TERMFLOW_AGENT_PROVIDER_DEEPSEEK_RETENTION_TERMS}
      TERMFLOW_AGENT_PROVIDER_DEEPSEEK_RETENTION_VERSION: ${TERMFLOW_AGENT_PROVIDER_DEEPSEEK_RETENTION_VERSION:?set TERMFLOW_AGENT_PROVIDER_DEEPSEEK_RETENTION_VERSION}
      TERMFLOW_AGENT_PROVIDER_DEEPSEEK_NO_TRAINING: ${TERMFLOW_AGENT_PROVIDER_DEEPSEEK_NO_TRAINING:?set TERMFLOW_AGENT_PROVIDER_DEEPSEEK_NO_TRAINING}
      TERMFLOW_AGENT_PROVIDER_DEEPSEEK_CREDENTIAL_SOURCE: DEEPSEEK_API_KEY
      TERMFLOW_AGENT_PROVIDER_DEEPSEEK_POLICY_VERSION: ${TERMFLOW_AGENT_PROVIDER_DEEPSEEK_POLICY_VERSION:?set TERMFLOW_AGENT_PROVIDER_DEEPSEEK_POLICY_VERSION}
    ports:
      # Bind address is configurable: deployments keep the loopback-only
      # default; Docker Desktop (WSL2) verification overrides it to 0.0.0.0
      # because its loopback port forwarding resets WSL-side connections.
      - ${TERMFLOW_HOST_BIND:-127.0.0.1}:${TERMFLOW_HOST_PORT:-8765}:8000
    volumes:
      - termflow-data:/app/data
      - termflow-totp-key:/app/totp-secrets
    networks:
      # B serves Web C and the A/C API through the host-published endpoint on
      # the normal default bridge, and reaches OpenCode only over the internal
      # agent network.
      - default
      - agent_internal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  # A fresh named volume is owned by root. This one-shot, networkless init
  # container grants only the pinned guest UID access to the dedicated data
  # volume before the long-running non-root service starts.
  opencode-init:
    image: ghcr.io/anomalyco/opencode:1.18.18@sha256:f3e00f8e25500150373c817e24b13f2f08e2ccd4cafd53dc3ad4827d47863b6f
    entrypoint:
      - /bin/sh
      - -ec
    command:
      - chown 0:0 /data && chmod 0700 /data && chown 405:100 /data
    volumes:
      - termflow-opencode-data:/data
    network_mode: none
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
    security_opt:
      - no-new-privileges:true
    read_only: true
    mem_limit: 32m
    cpus: "0.25"
    pids_limit: 32
    restart: "no"

  opencode-agent:
    # The pinned image, non-root UID 405, and OPENCODE_SERVER_* basic auth are
    # exercised by the opt-in M4 container test when Docker is available.
    image: ghcr.io/anomalyco/opencode:1.18.18@sha256:f3e00f8e25500150373c817e24b13f2f08e2ccd4cafd53dc3ad4827d47863b6f
    command:
      - serve
      - --hostname
      - 0.0.0.0
      - --port
      - "4096"
    environment:
      # The frozen deny-by-default config is canonical in deploy/ and mounted
      # read-only from /etc/termflow (see volumes); not overridable at runtime.
      OPENCODE_CONFIG: /etc/termflow/opencode-config.yaml
      # HTTP Basic auth for the internal B-to-OpenCode connection (official
      # OPENCODE_SERVER_* variables); values must come from deployment secrets,
      # never a committed file.
      OPENCODE_SERVER_USERNAME: ${OPENCODE_SERVER_USERNAME:?set OPENCODE_SERVER_USERNAME}
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?set OPENCODE_SERVER_PASSWORD}
      HOME: /home/opencode
      # Keep persistent OpenCode data outside HOME so Docker never creates
      # root-owned nested mountpoint parents inside the non-root HOME tmpfs.
      XDG_DATA_HOME: /data
      # The TermFlow MCP server entry is interpolated from these values by
      # OpenCode's native {env:} config substitution (spike-verified on the
      # pinned image).  The token is a B-issued AgentToken (raw shown once)
      # bound to the binding's runtime epoch; rotate it with the binding.
      TERMFLOW_AGENT_MCP_URL: http://control-plane:8000/api/v1/agent/mcp
      TERMFLOW_AGENT_MCP_TOKEN: ${OPENCODE_AGENT_MCP_TOKEN:?set OPENCODE_AGENT_MCP_TOKEN}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY}
      HTTPS_PROXY: http://provider-egress-proxy:3128
      NO_PROXY: control-plane,opencode-agent,localhost,127.0.0.1
      # BusyBox wget (used by the pinned runtime image's diagnostics) reads
      # lowercase http_proxy even for HTTPS URLs; keep the conventional
      # HTTPS variants too so the runtime and probes share the same boundary.
      http_proxy: http://provider-egress-proxy:3128
      https_proxy: http://provider-egress-proxy:3128
      no_proxy: control-plane,opencode-agent,localhost,127.0.0.1
    depends_on:
      opencode-init:
        condition: service_completed_successfully
    volumes:
      # Dedicated data volume for backend conversation persistence; no docker
      # socket, no A directories, no TermFlow credentials, and no arbitrary
      # host workspaces are ever mounted.
      - termflow-opencode-data:/data
      # The frozen OpenCode config fixture is the only host file mounted,
      # read-only.
      - type: bind
        source: ./opencode-config.yaml
        target: /etc/termflow/opencode-config.yaml
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "4096"
    networks:
      # Internal network only: never attached to the public A/C network. The
      # model runtime reaches the provider only through the allowlist proxy.
      - agent_internal
      - provider_egress
    user: "405:100"
    # The image's fixed `guest` UID 405 runs the server; /home/opencode is a
    # tmpfs (read-only rootfs, so no other HOME can be created) and the data
    # volume mounts underneath it.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid
      - /home/opencode:size=512m,noexec,nosuid,uid=405,gid=100,mode=0700
    mem_limit: ${OPENCODE_MEM_LIMIT:-2g}
    cpus: ${OPENCODE_CPUS:-2}
    pids_limit: 512
    ulimits:
      nofile:
        soft: 1024
        hard: 1024
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      # The image ships busybox wget (no node/curl); /global/health requires
      # the OPENCODE_SERVER_* basic auth. Default Docker seccomp/AppArmor
      # profiles apply (never "unconfined").
      test:
        - CMD-SHELL
        - >-
          auth="$$(printf '%s:%s' "$$OPENCODE_SERVER_USERNAME" "$$OPENCODE_SERVER_PASSWORD" | base64 | tr -d '\n')";
          wget -Y off -q -O- --header "Authorization: Basic $$auth"
          http://127.0.0.1:4096/global/health | grep -q healthy
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 15s

  # `ubuntu/squid:6.10-24.10_beta` index digest, resolved from Canonical's
  # verified Docker Hub publisher page on 2026-09-07.  Runtime compatibility
  # with this rootless/read-only profile must be checked before live rollout.
  provider-egress-proxy:
    image: ubuntu/squid:6.10-24.10_beta@sha256:c9f5212b147a766529c7b026e2bebed37b998d33d0066b658596af5eba7cc65c
    user: "13:13"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./provider-egress/squid.conf
        target: /etc/squid/squid.conf
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /run/squid:size=8m,mode=0750,uid=13,gid=13
      - /var/log/squid:size=8m,mode=0750,uid=13,gid=13
      - /var/spool/squid:size=16m,mode=0750,uid=13,gid=13
    expose:
      - "3128"
    networks:
      - provider_egress
      - provider_uplink
    mem_limit: 128m
    cpus: "0.50"
    pids_limit: 128
    healthcheck:
      # The pinned Ubuntu image does not ship squidclient/curl/wget.  Bash's
      # /dev/tcp is available in the image and verifies that Squid is
      # accepting an HTTP request without contacting an external provider.
      test:
        - CMD
        - bash
        - -ec
        - >-
          exec 3<>/dev/tcp/127.0.0.1/3128;
          printf 'GET http://127.0.0.1/ HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
          IFS= read -r status <&3;
          case "$$status" in HTTP/*) ;; *) exit 1 ;; esac
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  termflow-data:
    name: termflow-data
  termflow-totp-key:
    name: termflow-totp-key
  termflow-opencode-data:
    name: termflow-opencode-data

networks:
  # Host-facing bridge for B's explicit port publish and same-host A/C.
  # Keep capability-specific isolation in the networks below instead.
  default:
    internal: false
  agent_internal:
    internal: true
  provider_egress:
    internal: true
  provider_uplink:
    internal: false
