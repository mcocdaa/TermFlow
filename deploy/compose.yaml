services:
  control-plane:
    image: ${TERMFLOW_IMAGE:?set TERMFLOW_IMAGE to a pinned GHCR tag}
    command:
      - /opt/termflow/bin/termflow-control
      - serve
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      TERMFLOW_ADMIN_TOKEN: ${TERMFLOW_ADMIN_TOKEN:?set TERMFLOW_ADMIN_TOKEN}
      TERMFLOW_DATABASE_URL: sqlite+aiosqlite:////app/data/termflow.db
      TERMFLOW_ALLOW_INSECURE_LOOPBACK: ${TERMFLOW_ALLOW_INSECURE_LOOPBACK:-true}
      TERMFLOW_STATIC_DIR: /app/frontend-dist
      TERMFLOW_PUBLIC_BASE_URL: ${TERMFLOW_PUBLIC_BASE_URL:-http://127.0.0.1:8765}
      TERMFLOW_TRUSTED_WEB_ORIGINS: ${TERMFLOW_TRUSTED_WEB_ORIGINS:-http://127.0.0.1:8765}
      TERMFLOW_BROWSER_SESSION_TTL_SECONDS: ${TERMFLOW_BROWSER_SESSION_TTL_SECONDS:-28800}
      TERMFLOW_BROWSER_SESSION_CAPACITY: ${TERMFLOW_BROWSER_SESSION_CAPACITY:-4096}
      TERMFLOW_TOTP_MASTER_KEY:
      TERMFLOW_TOTP_AUTO_MASTER_KEY_FILE: /app/data/totp-master-key
      TERMFLOW_ENROLLMENT_TOKEN_TTL_SECONDS: ${TERMFLOW_ENROLLMENT_TOKEN_TTL_SECONDS:-60}
      TERMFLOW_TERMINAL_MAX_FRAME_BYTES: ${TERMFLOW_TERMINAL_MAX_FRAME_BYTES:-65536}
      TERMFLOW_TERMINAL_INPUT_RATE_BYTES_PER_SECOND: ${TERMFLOW_TERMINAL_INPUT_RATE_BYTES_PER_SECOND:-262144}
      TERMFLOW_TERMINAL_QUEUE_MAX_MESSAGES: ${TERMFLOW_TERMINAL_QUEUE_MAX_MESSAGES:-256}
      TERMFLOW_TERMINAL_QUEUE_MAX_BYTES: ${TERMFLOW_TERMINAL_QUEUE_MAX_BYTES:-1048576}
      TERMFLOW_TERMINAL_RESUME_GRACE_SECONDS: ${TERMFLOW_TERMINAL_RESUME_GRACE_SECONDS:-30}
    ports:
      - 127.0.0.1:${TERMFLOW_HOST_PORT:-8765}:8000
    volumes:
      - termflow-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  termflow-data:
    name: ${TERMFLOW_DATA_VOLUME:-termflow-data}
