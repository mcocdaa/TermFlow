# No plaintext forwarding, arbitrary upstreams, cache, or URL-bearing access
# logs are permitted. `-n` prevents reverse lookup: an IP literal can never
# acquire the allowlisted DNS name through a PTR record.
http_port 3128
# The live proxy has a read-only rootfs; keep Squid's pid file on its
# dedicated writable runtime tmpfs instead of the image root (/run/squid.pid).
pid_filename /run/squid/squid.pid

acl CONNECT method CONNECT
acl deepseek dstdomain -n api.deepseek.com
acl tls_port port 443
acl raw_ipv4 dstdom_regex -n ^[0-9]{1,3}(\.[0-9]{1,3}){3}$
acl raw_ipv6 dstdom_regex -n ^\[?[0-9A-Fa-f:]+\]?$
acl manager proto cache_object
acl localhost src 127.0.0.1/32 ::1

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log none
cache_log /dev/null
forwarded_for delete
via off

http_access allow manager localhost
http_access deny CONNECT raw_ipv4
http_access deny CONNECT raw_ipv6
http_access allow CONNECT deepseek tls_port
http_access deny all
