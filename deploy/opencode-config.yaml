{
  "$schema": "https://opencode.ai/config.json",
  "permission": {
    "*": "deny",
    "termflow_*": "allow"
  },
  "mcp": {
    "termflow": {
      "type": "remote",
      "url": "{env:TERMFLOW_AGENT_MCP_URL}",
      "headers": {
        "Authorization": "Bearer {env:TERMFLOW_AGENT_MCP_TOKEN}"
      },
      "enabled": true
    }
  },
  "provider": {
    "deepseek": {
      "options": {
        "baseURL": "https://api.deepseek.com",
        "apiKey": "{env:DEEPSEEK_API_KEY}"
      },
      "models": {
        "deepseek-flash": {},
        "deepseek-v4-pro": {},
        "deepseek-v4-flash": {}
      }
    }
  }
}
